[project]
name = "self-evolving-harness"
version = "0.1.0"
description = "A frozen model that solves tasks on its harness and evolves the harness that runs it."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "harbor[daytona]",
    "openai>=2.0",
    "httpx>=0.28",
    "tiktoken>=0.9",
    "pyyaml>=6.0",
    "huggingface_hub>=0.30",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.uv.sources]
# Tested with Harbor 0.20.0 at this commit (see patches/ for an optional Daytona fix).
harbor = { git = "https://github.com/harbor-framework/harbor", rev = "8b1e89810676f40a69b9e03deb38aba9adea6e5b" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness_kernel", "model_clients", "evolution", "judges", "adapters", "anti_cheat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
