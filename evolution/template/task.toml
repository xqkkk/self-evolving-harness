schema_version = "1.4"

# The update task is an ordinary Harbor task. After the trial, the edited workspace is collected back
# to the host at <trial>/artifacts/app/harness_workspace/.
artifacts = ["/app/harness_workspace"]

[task]
name = "harness/update-harness"
version = "1.0.0"
authors = []
keywords = ["harness-evolution"]

[metadata]
difficulty = "hard"
category = "meta"
tags = ["harness-evolution"]

[verifier]
timeout_sec = 300.0

[agent]
# One hour per update session in the first stage; the second stage raises it to two hours
# (configs/stage2.json, "update_timeout_sec").
timeout_sec = 3600.0

[environment]
# In the paper, update sessions could reach only package registries and code hosting (no general web access);
# configure the sandbox network of your backend accordingly.
build_timeout_sec = 900.0
cpus = 2
memory_mb = 8192
storage_mb = 10240
gpus = 0
mcp_servers = []
